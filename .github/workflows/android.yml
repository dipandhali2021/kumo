name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      # The action defaults to installing the legacy "tools" package, which Google
      # has removed from the SDK repository. sdkmanager then fails with
      # "Failed to find package 'tools'" and aborts the job. The real packages are
      # installed on the next line and no adb is used, so skip the default set.
      packages: ''
   - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.11.1'
   - run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
   - uses: actions/upload-artifact@v4
     with:
      name: Kumo-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      
